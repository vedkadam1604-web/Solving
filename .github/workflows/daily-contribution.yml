name: 🌱 Daily GitHub Contribution Agent

on:
  schedule:
    # Runs at 09:00, 13:00, and 18:00 UTC daily
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Contribution Agent"
          git config --global user.email "action@github.com"

      - name: Run contribution agent
        run: python .github/scripts/contribute.py

      - name: Push changes
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "$(python .github/scripts/generate_message.py)"
          git push
